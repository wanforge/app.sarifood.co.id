<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#honeyGrad)"/>

  <!-- Outer Ring Shield/Glow -->
  <circle cx="256" cy="256" r="210" stroke="#fef3c7" stroke-width="8" stroke-opacity="0.3" stroke-dasharray="16 12"/>

  <!-- Honey Pot Silhouette / Icon -->
  <g transform="translate(106, 96) scale(12.5)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wings Duotone -->
    <path d="M12 7C14.5 3 19 3 20 5.5C21 8 18 11.5 14 10.5" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M12 7C9.5 3 5 3 4 5.5C3 8 6 11.5 10 10.5" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Bee Body -->
    <ellipse cx="12" cy="14" rx="4.5" ry="6" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Bee Stripes -->
    <path d="M8 12H16M8 15H16M9 18H15" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Stinger & Antennae -->
    <path d="M12 20V22M10 8L8 5M14 8L16 5" stroke="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- Crown / Star Accent -->
  <circle cx="256" cy="74" r="14" fill="#fef3c7"/>
  <circle cx="216" cy="84" r="8" fill="#fef3c7" fill-opacity="0.7"/>
  <circle cx="296" cy="84" r="8" fill="#fef3c7" fill-opacity="0.7"/>
</svg>
